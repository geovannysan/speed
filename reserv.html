            </div>

            <div  class="grid grid-flow-col  gap-2" >
                
            <div class="row-cols-2">
                <label class="block text-gray-700 text-sm font-bold mb-2">Fecha de reserva:</label>

            </div>
            <div class="row-cols-2">

            </div>
            </div>

            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">Total a pagar:</label>

            </div>

            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">Método de pago:</label>
                <select class="w-full p-2 border rounded">
                    <option value="Efectivo">Efectivo</option>
                    <option  value="Tarjeta">Tarjeta</option>

            </div>

            <div>

            <div class="flex items-center justify-center w-full mb-3">

                        </svg>

                            <span class="font-semibold">Click to upload</span>
                            su lista de invitados</p>

                    </div>
                    <input id="dropzone-file" type="file" class="hidden" />

            <div class="text-sm text-gray-600 bg-gray-50 p-3 rounded">
                <p><strong>Términos y Condiciones:</strong> La reserva es válida una vez realizada la confirmación y

                    responsable por cambios de último minuto.</p>
            </div>
            

            <button type="submit" class="w-full bg-purple-700 text-white py-2 rounded hover:bg-purple-800 transition">
                Enviar Reserva

    function FechaMaxima() {
        const inputFecha = document.getElementById('fecha');

        const hoy = new Date();
        const edadLimite = 16;

        // Establecer la fecha máxima (hace 16 años)
        const fechaMax = new Date(hoy);
        fechaMax.setFullYear(hoy.getFullYear() - edadLimite);

        // Formatear la fecha en formato yyyy-mm-dd
        const yyyy = fechaMax.getFullYear();
        const mm = String(fechaMax.getMonth() + 1).padStart(2, '0');
        const dd = String(fechaMax.getDate()).padStart(2, '0');

        const fechaMaxString = `${yyyy}-${mm}-${dd}`;

        // Asignar la fecha máxima al campo
        inputFecha.max = fechaMaxString;
    }
    function reserMaxima(){
         const inputFecha = document.getElementById('reserva');

        const hoy = new Date();
        const yyyy = hoy.getFullYear();
        const mm = String(hoy.getMonth() + 1).padStart(2, '0');
        const dd = String(hoy.getDate()).padStart(2, '0');

        const fechaHoy = `${yyyy}-${mm}-${dd}`;
        inputFecha.min = fechaHoy;
    }
    let fecha = document.getElementById("fecha")
    fecha.addEventListener("blur", e => {
        console.log(e.target.value)
        const value = e.target.value;

        // Expresión regular para validar formato dd/mm/aaaa
        const regex = /^\d{4}\/\d{2}\/\d{2}$/;

        if (String(value).length != 10) return
        const birthday_date = new Date(e.target.value);
        const ageDifMs = Date.now() - birthday_date.getTime();
        const ageDate = new Date(ageDifMs);
        const edad = Math.abs(ageDate.getUTCFullYear() - 1970);
        console.log("Edad:", edad);
        document.getElementById("edad").value = edad;
    })
    fecha.addEventListener("change", e => {
        //console.log(e.target.value)

        const value = e.target.value;

        // Expresión regular para validar formato dd/mm/aaaa
        const regex = /^\d{2}\/\d{2}\/\d{4}$/;

        if (!regex.test(value)) return

        const birthday_date = new Date(e.target.value);
        const ageDifMs = Date.now() - birthday_date.getTime();
        const ageDate = new Date(ageDifMs);
